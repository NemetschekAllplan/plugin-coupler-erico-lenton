# Configuration file for ERICO module in Allplan.
# The lines begining with "#" are considered as comment.
#
# maximal value for allowed distance of axis between bars of two placements
max_d 200
# multiplication factor for bar-diameter to calculate allowed distance of axis between bars of two placements
mult 5
# flag, how to create threads for bars -> 1 - ask the user for existing coupler for which the thread is created
#                                         0 - don't ask  
thread 1
